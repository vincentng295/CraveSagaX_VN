<!DOCTYPE html>
<html lang="vi" id="html-root">
<head>
  <meta charset="UTF-8">
  <title>Quản lý Phiên dịch - CraveSagaX VN</title>
  <style>
    :root {
      --bg-page: #f3f4f6;
      --bg-container: #fff;
      --text-main: #1f2937;
      --text-heading: #111827;
      --text-muted: #6b7280;
      --border-color: #e5e7eb;
      --border-input: #d1d5db;
      --bg-input: #fff;
      --bg-th: #f9fafb;
      --text-th: #374151;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      --speaker-bg: #eef2ff;
      --speaker-text: #4338ca;
      --chap-bg: #f3f4f6;
      --chap-text: #374151;
      --speaker-none: #9ca3af;
      --row-hover: #f9fafb;
    }
    [data-theme="dark"] {
      --bg-page: #111827;
      --bg-container: #1f2937;
      --text-main: #e5e7eb;
      --text-heading: #f9fafb;
      --text-muted: #9ca3af;
      --border-color: #374151;
      --border-input: #4b5563;
      --bg-input: #111827;
      --bg-th: #111827;
      --text-th: #d1d5db;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.4);
      --speaker-bg: #312e81;
      --speaker-text: #c7d2fe;
      --chap-bg: #374151;
      --chap-text: #d1d5db;
      --speaker-none: #6b7280;
      --row-hover: #263041;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      margin: 0;
      padding: 24px;
      transition: background-color 0.2s, color 0.2s;
    }
    .container {
      max-width: 980px;
      margin: 0 auto;
      background: var(--bg-container);
      padding: 24px;
      border-radius: 12px;
      box-shadow: var(--shadow);
      transition: background-color 0.2s;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 16px;
      margin-bottom: 20px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .title h1 { margin: 0; font-size: 22px; color: var(--text-heading); }
    .title p { margin: 4px 0 0; font-size: 13px; color: var(--text-muted); }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .search-box {
      flex: 1;
      min-width: 200px;
      padding: 8px 12px;
      border: 1px solid var(--border-input);
      border-radius: 6px;
      font-size: 14px;
      background: var(--bg-input);
      color: var(--text-main);
    }
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-success { background: #10b981; color: #fff; }
    .btn-success:hover { background: #059669; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-danger:hover { background: #dc2626; }

    .theme-toggle-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid var(--border-input);
      background: var(--bg-input);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      white-space: nowrap;
    }
    .theme-toggle-btn:hover { border-color: #2563eb; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      table-layout: fixed;
    }
    th, td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-color);
      font-size: 14px;
      overflow-wrap: break-word;
      word-break: break-word;
    }
    th { background: var(--bg-th); font-weight: 600; color: var(--text-th); }
    tbody tr:hover { background: var(--row-hover); }
    .input-edit {
      width: 100%;
      field-sizing: content;
      min-height: 38px;
      padding: 6px 8px;
      border: 1px solid var(--border-input);
      border-radius: 4px;
      font-size: 13px;
      font-family: inherit;
      line-height: 1.4;
      resize: vertical;
      box-sizing: border-box;
      background: var(--bg-input);
      color: var(--text-main);
    }
    .input-edit:focus {
      outline: 2px solid #2563eb;
      border-color: transparent;
    }
    .actions { display: flex; gap: 6px; flex-wrap: nowrap; }
    .actions .btn { padding: 6px 10px; }
    .speaker-badge {
      display: inline-block;
      padding: 3px 8px;
      background: var(--speaker-bg);
      color: var(--speaker-text);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    .chap-badge {
      display: inline-block;
      max-width: 100%;
      padding: 3px 8px;
      background: var(--chap-bg);
      color: var(--chap-text);
      border-radius: 4px;
      font-size: 11px;
      font-family: monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      vertical-align: bottom;
    }
    .speaker-none { color: var(--speaker-none); }
    .btn-save.saved { background: #10b981; }
    .status-bar {
      margin-top: 16px;
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }
    .time-cell {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .select-box {
      padding: 8px 10px;
      border: 1px solid var(--border-input);
      border-radius: 6px;
      font-size: 13px;
      background: var(--bg-input);
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="title">
        <h1>Quản lý Từ điển Dịch thuật</h1>
        <p>Thu thập, chỉnh sửa câu thoại đã dịch hoặc Import/Export file .json</p>
      </div>
      <div class="header-actions">
        <button class="theme-toggle-btn" id="btn-theme-toggle">🌙 Dark Mode</button>
        <div class="toolbar" style="margin-bottom: 0;">
          <button class="btn btn-success" id="btn-export">📥 Export JSON (Filtered)</button>
          <button class="btn btn-primary" id="btn-import-trigger">📤 Import JSON</button>
          <button class="btn btn-primary" id="btn-sync-remote">🔄 Đồng bộ bản dịch mới</button>
          <input type="file" id="file-import" accept=".json" multiple style="display: none;">
        </div>
      </div>
    </div>

    <div class="toolbar" style="align-items:center; border:1px solid var(--border-color); border-radius:8px; padding:12px; background:var(--bg-th);">
      <label for="engine-select" style="font-size:13px; font-weight:600; color:var(--text-th);">Công cụ dịch:</label>
      <select id="engine-select" class="select-box">
        <option value="google">Google Dịch (miễn phí, dịch từng câu)</option>
        <option value="gemma">Gemma / Gemini API (gộp lô, cần API Key)</option>
      </select>
      <input type="password" id="gemini-api-key" class="search-box" style="max-width:320px; display:none;" placeholder="Dán Gemini API Key vào đây...">
      <button class="btn btn-primary" id="btn-save-engine" style="display:none;">💾 Lưu API Key</button>
      <span id="engine-save-status" style="font-size:12px; color:var(--text-muted);"></span>
    </div>

    <div class="toolbar">
      <input type="text" id="search-input" class="search-box" placeholder="Tìm kiếm câu thoại gốc hoặc bản dịch... (Nhấn Enter hoặc bấm Tìm)">
      <button class="btn btn-primary" id="btn-search">🔍 Tìm</button>
      <select id="chap-filter-select" class="select-box">
        <option value="">Tất cả Chap/File</option>
      </select>

      <!-- Ô nhập remark cho chap đang được filter -->
      <input type="text" id="chap-remark-input" class="search-box" style="display: none; max-width: 220px;" placeholder="Đặt tên hiển thị (Remark)...">

      <button class="btn btn-primary" id="btn-retranslate-gemma" style="display: none;">🤖 Dịch lại bằng Gemma (chap này)</button>

      <select id="sort-select" class="select-box">
        <option value="time-desc">Mới nhất trước</option>
        <option value="time-asc" selected>Cũ nhất trước</option>
        <option value="key-asc">Theo A-Z</option>
      </select>
      <button class="btn btn-danger" id="btn-clear-all">Xóa tất cả</button>
    </div>

    <div id="gemma-retranslate-status" style="display:none; font-size:13px; color:var(--text-muted); margin-bottom:12px;"></div>
    <button class="btn btn-primary" id="btn-retranslate-gemma-retry" style="display: none; margin-bottom:12px;">🔁 Thử lại phần còn lại</button>

    <table>
      <colgroup>
        <col style="width: 120px;">
        <col style="width: 90px;">
        <col style="width: 37%;">
        <col style="width: 33%;">
        <col style="width: 120px;">
        <col style="width: 150px;">
      </colgroup>
      <thead>
        <tr>
          <th>Chap / File</th>
          <th>Nhân vật</th>
          <th>Tiếng Anh (Gốc)</th>
          <th>Tiếng Việt (Bản dịch)</th>
          <th>Thời gian</th>
          <th>Thao tác</th>
        </tr>
      </thead>
      <tbody id="dict-table-body">
        <!-- Dữ liệu render dynamic -->
      </tbody>
    </table>

    <div id="load-more-sentinel" style="text-align:center; padding:12px; font-size:13px; color:var(--text-muted); display:none;">
      Đang tải thêm...
    </div>

    <div class="status-bar">
      <span id="total-count">Tổng số câu: 0</span>
      <span id="save-status">Tự động lưu khi sửa</span>
    </div>
  </div>

  <script src="translation-settings.js"></script>
  <script src="options.js"></script>
</body>
</html>
