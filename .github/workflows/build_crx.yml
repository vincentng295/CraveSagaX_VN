name: Build & Release CRX

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Write private key from secret
        run: |
          cat > key.pem <<'EOF'
          ${{ secrets.CRX_PEM }}
          EOF

      - name: Stage extension source (loại các file không thuộc extension)
        run: |
          mkdir -p dist
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='key.pem' \
            --exclude='*.crx' \
            --exclude='README.md' \
            ./ dist/

      - name: Install crx packer
        run: npm install crx@5

      - name: Build .crx
        run: |
          node -e "
            const ChromeExtension = require('crx');
            const fs = require('fs');
            const crypto = require('crypto');

            const crx = new ChromeExtension({ privateKey: fs.readFileSync('key.pem') });

            crx.load('./dist')
              .then(c => c.pack())
              .then(buf => {
                fs.writeFileSync('extension.crx', buf);
                console.log('Built extension.crx (' + buf.length + ' bytes)');

                // In ra Extension ID cố định (phụ thuộc vào key.pem, không đổi giữa các lần build)
                const pub = crx.publicKey; // DER buffer
                const hash = crypto.createHash('sha256').update(pub).digest();
                const id = hash.slice(0, 16).toString('hex').split('')
                  .map(c => String.fromCharCode(97 + parseInt(c, 16)))
                  .join('');
                console.log('Extension ID: ' + id);
              })
              .catch(err => { console.error(err); process.exit(1); });
          "

      - name: Remove old 'latest' release (nếu có)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || echo "Chưa có release 'latest', bỏ qua."

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            Tự động build từ commit ${{ github.sha }}
          files: extension.crx
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup key
        if: always()
        run: rm -f key.pem